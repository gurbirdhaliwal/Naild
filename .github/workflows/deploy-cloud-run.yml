name: Deploy Spring API to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/788527456103/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  DEPLOY_SERVICE_ACCOUNT: 788527456103-compute@developer.gserviceaccount.com
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'knappi-repo' }}
  SPRING_SERVICE: ${{ vars.CLOUD_RUN_SPRING_SERVICE || 'knappi-spring' }}
  CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME || 'naild-491922:us-central1:knappi-user' }}
  CLOUD_SQL_DATABASE_NAME: ${{ vars.CLOUD_SQL_DATABASE_NAME || 'knappi_db' }}
  WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
  SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
  SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
  CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS || vars.WEB_ORIGIN }}
  APP_PASSWORD_RESET_BASE_URL: ${{ vars.APP_PASSWORD_RESET_BASE_URL }}
  APP_PASSWORD_RESET_EXPIRY_MINUTES: ${{ vars.APP_PASSWORD_RESET_EXPIRY_MINUTES || '60' }}
  APP_OAUTH_SUCCESS_REDIRECT_URL: ${{ vars.APP_OAUTH_SUCCESS_REDIRECT_URL || 'https://knappi.ca/interview' }}
  APP_AUTH_COOKIE_SECURE: ${{ vars.APP_AUTH_COOKIE_SECURE || 'true' }}
  APP_AUTH_COOKIE_SAME_SITE: ${{ vars.APP_AUTH_COOKIE_SAME_SITE || 'Lax' }}
  APP_AUTH_COOKIE_DOMAIN: ${{ vars.APP_AUTH_COOKIE_DOMAIN || '.knappi.ca' }}
  APP_AUTH_ME_REQUIRE_DB_VALIDATION: ${{ vars.APP_AUTH_ME_REQUIRE_DB_VALIDATION || 'false' }}
  SERVER_FORWARD_HEADERS_STRATEGY: ${{ vars.SERVER_FORWARD_HEADERS_STRATEGY || 'framework' }}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${{ vars.SPRING_JPA_HIBERNATE_DDL_AUTO || 'none' }}
  SPRING_JPA_SHOW_SQL: ${{ vars.SPRING_JPA_SHOW_SQL || 'false' }}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${{ vars.SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE || '0' }}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${{ vars.SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE || '5' }}
  SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: ${{ vars.SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT || '-1' }}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${{ vars.SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT || '5000' }}
  CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '1' }}
  APP_MAIL_MODE: ${{ vars.APP_MAIL_MODE || 'log' }}
  APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM || 'noreply@knappi.local' }}
  APP_LOGIN_VERIFICATION_EXPIRY_MINUTES: ${{ vars.APP_LOGIN_VERIFICATION_EXPIRY_MINUTES || '10' }}
  SPRING_MAIL_HOST: ${{ vars.SPRING_MAIL_HOST }}
  SPRING_MAIL_PORT: ${{ vars.SPRING_MAIL_PORT || '587' }}
  SPRING_MAIL_USERNAME: ${{ vars.SPRING_MAIL_USERNAME }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${{ vars.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH || 'true' }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${{ vars.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE || 'true' }}
  SPRING_DATASOURCE_PASSWORD_SECRET_NAME: ${{ vars.SPRING_DATASOURCE_PASSWORD_SECRET_NAME || 'spring-datasource-password' }}
  APP_JWT_SECRET_NAME: ${{ vars.APP_JWT_SECRET_NAME || 'app-jwt-secret' }}
  GOOGLE_OAUTH_CLIENT_SECRET_NAME: ${{ vars.GOOGLE_OAUTH_CLIENT_SECRET_NAME || 'google-oauth-client-secret' }}
  SPRING_MAIL_PASSWORD_SECRET_NAME: ${{ vars.SPRING_MAIL_PASSWORD_SECRET_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            PROJECT_ID
            WEB_ORIGIN
            CLOUD_SQL_INSTANCE_CONNECTION_NAME
            CLOUD_SQL_DATABASE_NAME
            SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME
            GOOGLE_OAUTH_CLIENT_ID
            APP_PASSWORD_RESET_BASE_URL
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions variable: ${name}"
              exit 1
            fi
          done

          if [[ "${SPRING_DATASOURCE_URL}" == *"127.0.0.1"* || "${SPRING_DATASOURCE_URL}" == *"localhost"* ]]; then
            echo "::error::SPRING_DATASOURCE_URL points to localhost. Cloud Run needs the production Cloud SQL URL, for example jdbc:mysql:///knappi_db?cloudSqlInstance=${CLOUD_SQL_INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false"
            exit 1
          fi

          if [[ "${SPRING_SERVICE}" == naild-* ]]; then
            echo "::error::Cloud Run service variable still points to an old naild service. Set CLOUD_RUN_SPRING_SERVICE=knappi-spring."
            exit 1
          fi

          if [[ "${WEB_ORIGIN}" != "https://knappi.ca" || "${CORS_ALLOW_ORIGINS}" != *"https://knappi.ca"* ]]; then
            echo "::error::WEB_ORIGIN/CORS_ALLOW_ORIGINS must include https://knappi.ca."
            exit 1
          fi

          if [[ "${APP_PASSWORD_RESET_BASE_URL}" != "https://knappi.ca/reset-password" || "${APP_OAUTH_SUCCESS_REDIRECT_URL}" != "https://knappi.ca/interview" ]]; then
            echo "::error::Spring auth redirect URLs must point to knappi.ca."
            exit 1
          fi

          if [[ "${APP_MAIL_MODE}" == "smtp" ]]; then
            smtp_required=(
              SPRING_MAIL_HOST
              SPRING_MAIL_USERNAME
              SPRING_MAIL_PASSWORD_SECRET_NAME
            )

            for name in "${smtp_required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::APP_MAIL_MODE=smtp requires GitHub Actions variable: ${name}"
                exit 1
              fi
            done
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Test gcloud
        run: gcloud info

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SPRING_SERVICE}:${GITHUB_SHA}"
          docker build -f Dockerfile -t "${IMAGE}" .

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SPRING_SERVICE}:${GITHUB_SHA}"
          docker push "${IMAGE}"

      - name: Deploy Spring API
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SPRING_SERVICE}:${GITHUB_SHA}"
          env_vars="SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}|SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}|SPRING_CLOUD_GCP_SQL_DATABASE_NAME=${CLOUD_SQL_DATABASE_NAME}|SPRING_CLOUD_GCP_SQL_INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE_CONNECTION_NAME}|SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}|CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}|APP_PASSWORD_RESET_BASE_URL=${APP_PASSWORD_RESET_BASE_URL}|APP_PASSWORD_RESET_EXPIRY_MINUTES=${APP_PASSWORD_RESET_EXPIRY_MINUTES}|APP_LOGIN_VERIFICATION_EXPIRY_MINUTES=${APP_LOGIN_VERIFICATION_EXPIRY_MINUTES}|APP_OAUTH_SUCCESS_REDIRECT_URL=${APP_OAUTH_SUCCESS_REDIRECT_URL}|APP_AUTH_COOKIE_SECURE=${APP_AUTH_COOKIE_SECURE}|APP_AUTH_COOKIE_SAME_SITE=${APP_AUTH_COOKIE_SAME_SITE}|APP_AUTH_COOKIE_DOMAIN=${APP_AUTH_COOKIE_DOMAIN}|APP_AUTH_ME_REQUIRE_DB_VALIDATION=${APP_AUTH_ME_REQUIRE_DB_VALIDATION}|SERVER_FORWARD_HEADERS_STRATEGY=${SERVER_FORWARD_HEADERS_STRATEGY}|SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}|SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}|SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}|SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}|SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT}|SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}|APP_MAIL_MODE=${APP_MAIL_MODE}|APP_MAIL_FROM=${APP_MAIL_FROM}"
          secrets="SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD_SECRET_NAME}:latest,APP_JWT_SECRET=${APP_JWT_SECRET_NAME}:latest,SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET_NAME}:latest"

          if [[ "${APP_MAIL_MODE}" == "smtp" ]]; then
            env_vars="${env_vars}|SPRING_MAIL_HOST=${SPRING_MAIL_HOST}|SPRING_MAIL_PORT=${SPRING_MAIL_PORT}|SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}|SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}|SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}"
            secrets="${secrets},SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD_SECRET_NAME}:latest"
          fi

          args=(
            run deploy "${SPRING_SERVICE}"
            --image "${IMAGE}"
            --project "${PROJECT_ID}"
            --region "${REGION}"
            --platform managed
            --allow-unauthenticated
            --ingress all
            --memory 1Gi
            --min-instances "${CLOUD_RUN_MIN_INSTANCES}"
            --cpu-boost
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
            --set-env-vars "^|^${env_vars}"
            --set-secrets "${secrets}"
          )

          if [[ -n "${CLOUD_RUN_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account "${CLOUD_RUN_SERVICE_ACCOUNT}")
          fi

          gcloud "${args[@]}"
