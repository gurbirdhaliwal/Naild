spring.application.name=security
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/User
spring.datasource.username=root
spring.datasource.password=REMOVED-ROTATED-DB-PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

spring.security.oauth2.client.registration.google.client-id=REMOVED-OAUTH-CLIENT-ID.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=REMOVED-ROTATED-OAUTH-CLIENT-SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.client-name=Google
