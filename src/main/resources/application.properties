spring.application.name=security
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/User}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app.cors.allowed-origins=${CORS_ALLOW_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://knappi.ca,https://www.knappi.ca}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie-domain=${APP_AUTH_COOKIE_DOMAIN:}

app.jwt.secret=${APP_JWT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.client-name=Google

app.mail.mode=${APP_MAIL_MODE:log}
app.mail.from=${APP_MAIL_FROM:no-reply@knappi.local}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
app.password-reset.expiry-minutes=${APP_PASSWORD_RESET_EXPIRY_MINUTES:60}
app.login-verification.expiry-minutes=${APP_LOGIN_VERIFICATION_EXPIRY_MINUTES:10}
app.oauth.success-redirect-url=${APP_OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000/interview}
